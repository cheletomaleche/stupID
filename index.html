    <script>
      // Defensive fix for browser environments and iframe executors assigning window.fetch
      (function() {
        try {
          let _fetch = window.fetch ? window.fetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _fetch;
            },
            set: function(fn) {
              _fetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn('Failed to define fetch accessor:', e);
        }
      })();
    </script>
